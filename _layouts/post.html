---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta muted">
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
      {% if page.categories %}
      <span class="sep">/</span>
      <span>{{ page.categories | join: ", " }}</span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    <a href="{{ '/' | relative_url }}">&larr; Back</a>
  </nav>
</article>
