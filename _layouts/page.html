---
layout: default
---
<div class="page terminal-page">
  <div class="page-header">
    <div class="prompt">
      <span class="prompt-user">{{ site.terminal.username }}</span>
      <span class="prompt-at">@</span>
      <span class="prompt-host">{{ site.terminal.hostname }}</span>
      <span class="prompt-colon">:~/</span>
      <span class="prompt-path">{{ page.dir | remove: "/" }}</span>
      <span class="prompt-char">{{ site.terminal.prompt_char }}</span>
    </div>
    <h1 class="page-title">{{ page.title }}</h1>
  </div>

  <hr class="separator">

  <div class="page-content">
    {{ content }}
  </div>
</div>
